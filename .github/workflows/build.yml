name: Build (Docker)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          scripts/install_build_dependencies.sh
          make
      - name: upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: output